
apiVersion: apps/v1
kind: Deployment

metadata:
  name: performance-testing

spec:
  replicas: 2

  selector:
    matchLabels:
      app: performance-testing

  template:
    metadata:
      labels:
        app: performance-testing

    spec:
      containers:
        - name: performance-testing
          image: performance-testing:2.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
